[workspace]
resolver = "2"
members = [
    "crates/common",
    "crates/domain",
    "crates/application",
    "crates/adapters",
    "crates/server",
]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
async-trait = "0.1"
futures-core = "0.3"
futures-util = "0.3"
worker = { version = "0.9", features = ["d1"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
serde-wasm-bindgen = "0.6"
console_error_panic_hook = "0.1"
