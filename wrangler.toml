name = "my-portfolio-assistant"
main = "crates/server/build/worker/shim.mjs"
compatibility_date = "2026-11-27"

[build]
command = "worker-build --release"
cwd = "crates/server"

[vars]
AI_EMBEDDING_MODEL = "@cf/baai/bge-m3"
AI_REWRITE_MODEL = "@cf/meta/llama-3.1-8b-instruct-fast"
AI_ANSWER_MODEL = "@cf/meta/llama-3.3-70b-instruct-fp8-fast"
AI_ANSWER_TEMPERATURE = "0.1"
RAG_TOP_K = "5"
RAG_MIN_SCORE = "0.35"
RAG_FALLBACK_LIMIT = "10"
RAG_RECENT_MESSAGES = "4"
RAG_CACHE_TTL_SECONDS = "86400"
RATE_LIMIT_WINDOW_SECONDS = "60"
RATE_LIMIT_IP_MAX = "20"
RATE_LIMIT_SESSION_MAX = "10"
CORS_ALLOWED_ORIGINS = "https://www.nguyenmanhhuy.id.vn,http://localhost:3000"

[[d1_databases]]
binding = "DB"
database_name = "my-portfolio-assistant-db"
database_id = "fddedf8c-f73b-4225-94b5-8a111173a3ae"

[[kv_namespaces]]
binding = "CACHE_KV"
id = "3964b81eb4ce447b93d213cd5c7f0201"

[[vectorize]]
binding = "VECTORIZE"
index_name = "portfolio-index"

[ai]
binding = "AI"
